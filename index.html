<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Menú Digital 🔥</title>
    <!-- Librería para leer el CSV de Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { 
            background-color: #0d0d0d; 
            color: #ffffff; 
            padding-top: env(safe-area-inset-top); 
            padding-bottom: 60px; 
        }

        header { 
            padding: 25px 20px 15px 20px; 
            text-align: center; 
        }
        h1 { 
            font-size: 1.6rem; 
            font-weight: 800; 
            letter-spacing: 1px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* NAVEGACIÓN SUPERIOR DE CATEGORÍAS */
        .nav-categorias { 
            display: flex; 
            overflow-x: auto; 
            padding: 12px 20px; 
            gap: 12px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(8px);
            scrollbar-width: none; 
            border-bottom: 1px solid #222;
            margin-bottom: 25px;
        }
        .nav-categorias::-webkit-scrollbar { display: none; }
        
        .nav-categorias a { 
            color: #a3a3a3; 
            text-decoration: none; 
            padding: 8px 18px; 
            background: #1c1c1c; 
            border: 1px solid #333;
            border-radius: 20px; 
            white-space: nowrap; 
            font-size: 0.85rem; 
            font-weight: 600; 
            transition: all 0.3s ease;
        }
        .nav-categorias a:hover, .nav-categorias a.activo { 
            background: #d32f2f; 
            color: white; 
            border-color: #d32f2f;
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.4); 
        }

        /* ESTRUCTURA PRINCIPAL (MENÚ A LA IZQUIERDA, RECUADRO A LA DERECHA) */
        .main-layout {
            display: flex;
            gap: 30px;
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 20px;
            align-items: flex-start;
        }

        .menu-seccion {
            flex: 1;
            min-width: 0;
        }

        .categoria { 
            margin-bottom: 40px; 
            padding-top: 70px; 
            margin-top: -60px; 
        }
        .categoria-titulo { 
            font-size: 1.4rem; 
            color: #d32f2f; 
            text-transform: uppercase; 
            font-weight: 800;
            margin-bottom: 15px; 
            display: inline-block;
            border-bottom: 2px solid #d32f2f;
            padding-bottom: 4px;
            letter-spacing: 1px;
        }

        /* TARJETAS DE PLATILLOS */
        .item-card { 
            background: #151515; 
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 15px; 
            margin-bottom: 12px;
            display: flex; 
            align-items: center; 
            gap: 15px; 
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }
        
        .item-card:hover {
            border-color: #555;
            transform: translateY(-1px);
        }

        .item-card.seleccionado {
            border-color: #d32f2f;
            background: #1e1515;
            box-shadow: 0 0 12px rgba(211, 47, 47, 0.35);
        }

        .item-img { 
            width: 55px; 
            height: 55px; 
            border-radius: 50%; 
            object-fit: cover; 
            background-color: #2a2a2a; 
            flex-shrink: 0; 
            border: 2px solid #333;
        }
        
        .item-info { flex: 1; }
        
        .item-nombre { 
            font-weight: 700; 
            font-size: 1.05rem; 
            margin: 0 0 4px 0; 
            color: #f1f1f1;
        }
        
        .item-desc-corta { 
            font-size: 0.8rem; 
            color: #888; 
            margin: 0; 
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .item-precio { 
            font-weight: 700; 
            color: #d32f2f; 
            font-size: 1rem; 
            background: rgba(211, 47, 47, 0.1); 
            border: 1px solid rgba(211, 47, 47, 0.3);
            padding: 6px 12px; 
            border-radius: 20px; 
            white-space: nowrap; 
        }

        /* RECUADRO LATERAL DERECHO (MINIMALISTA) */
        .preview-panel {
            width: 360px;
            position: sticky;
            top: 75px;
            background: #141414;
            border: 1px solid #282828;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .preview-img-wrapper {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            background: #202020;
            border: 1px solid #333;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .preview-titulo {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            line-height: 1.3;
        }

        .preview-precio {
            font-size: 1.15rem;
            font-weight: 800;
            color: #d32f2f;
            background: rgba(211, 47, 47, 0.15);
            border: 1px solid rgba(211, 47, 47, 0.4);
            padding: 4px 12px;
            border-radius: 15px;
            white-space: nowrap;
        }

        .preview-divider {
            height: 1px;
            background: #262626;
            margin: 2px 0;
        }

        .preview-desc-titulo {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #d32f2f;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .preview-desc {
            font-size: 0.9rem;
            color: #a3a3a3;
            line-height: 1.5;
            margin: 0;
            font-weight: 400;
        }

        #pantallaCarga { text-align: center; padding: 60px 20px; color: #666; font-size: 1.1rem; }

        @media (max-width: 820px) {
            .main-layout {
                flex-direction: column;
                gap: 20px;
            }
            .preview-panel {
                width: 100%;
                position: static;
                order: -1;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>MENÚ DIGITAL 🔥</h1>
    </header>

    <nav class="nav-categorias" id="barraNav"></nav>

    <div class="main-layout">
        <div class="menu-seccion" id="menuContainer">
            <div id="pantallaCarga">Cargando cortes y guisados...</div>
        </div>

        <aside class="preview-panel" id="previewPanel">
            <div class="preview-img-wrapper">
                <img src="" id="previewImg" class="preview-img" alt="Platillo seleccionado" onerror="this.src='https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80';">
            </div>
            <div class="preview-header">
                <h3 class="preview-titulo" id="previewTitulo">Selecciona un platillo</h3>
                <span class="preview-precio" id="previewPrecio">$0.00</span>
            </div>
            <div class="preview-divider"></div>
            <div>
                <p class="preview-desc-titulo">Descripción</p>
                <p class="preview-desc" id="previewDesc">Toca cualquier producto del menú para ver sus detalles e imagen completa aquí.</p>
            </div>
        </aside>
    </div>

    <script>
        const urlCSV = 'https://docs.google.com/spreadsheets/d/1Yf2x7wxdH5qiP4b8KOpgBHB_WQ51O83VQT4y6D4dZPU/export?format=csv'; 
        let listaMenuData = [];

        Papa.parse(urlCSV, {
            download: true,
            header: true,
            complete: function(resultados) {
                renderizarMenu(resultados.data);
            },
            error: function() {
                document.getElementById('pantallaCarga').innerText = "Hubo un error cargando el menú. Verifica la conexión.";
            }
        });

        function renderizarMenu(datos) {
            const nav = document.getElementById('barraNav');
            const container = document.getElementById('menuContainer');
            nav.innerHTML = '';
            container.innerHTML = '';
            
            // Guardar solo filas válidas en memoria
            listaMenuData = datos.filter(fila => fila.Categoría && fila.Producto);

            const categorias = {};
            listaMenuData.forEach((item, index) => {
                item._posicion = index;
                if(!categorias[item.Categoría]) categorias[item.Categoría] = [];
                categorias[item.Categoría].push(item);
            });

            let esPrimero = true;
            let HTMLCompleto = '';

            Object.keys(categorias).forEach(cat => {
                const idCat = cat.replace(/\s+/g, '-').toLowerCase();
                const claseActivo = esPrimero ? 'class="activo"' : '';
                nav.innerHTML += `<a href="#${idCat}" ${claseActivo}>${cat}</a>`;

                HTMLCompleto += `<div id="${idCat}" class="categoria">
                                    <h2 class="categoria-titulo">${cat}</h2>`;

                categorias[cat].forEach(item => {
                    const descCorta = (item.Descripción && item.Descripción !== '-') ? item.Descripción : '';
                    const rutaImg = (item.Imagen && item.Imagen.trim() !== '') ? item.Imagen.trim() : '';
                    
                    const imgElement = rutaImg 
                        ? `<img src="${rutaImg}" class="item-img" alt="${item.Producto}" onerror="this.style.display='none'">`
                        : ``;

                    HTMLCompleto += `
                        <div class="item-card" id="item-card-${item._posicion}" onclick="seleccionarPorIndice(${item._posicion})">
                            ${imgElement}
                            <div class="item-info">
                                <p class="item-nombre">${item.Producto}</p>
                                ${descCorta ? `<p class="item-desc-corta">${descCorta}</p>` : ''}
                            </div>
                            <div class="item-precio">${item.Precio}</div>
                        </div>
                    `;
                });

                HTMLCompleto += `</div>`;
                esPrimero = false;
            });

            container.innerHTML = HTMLCompleto;

            // Seleccionar automáticamente el primer platillo al cargar
            if (listaMenuData.length > 0) {
                seleccionarPorIndice(0);
            }

            // Navegación superior
            const enlacesNav = nav.querySelectorAll('a');
            enlacesNav.forEach(enlace => {
                enlace.addEventListener('click', function() {
                    enlacesNav.forEach(e => e.classList.remove('activo'));
                    this.classList.add('activo');
                });
            });
        }

        function seleccionarPorIndice(index) {
            const item = listaMenuData[index];
            if (!item) return;

            // Resaltar tarjeta activa
            document.querySelectorAll('.item-card').forEach(card => card.classList.remove('seleccionado'));
            const tarjetaActiva = document.getElementById(`item-card-${index}`);
            if (tarjetaActiva) tarjetaActiva.classList.add('seleccionado');

            // Actualizar datos del panel lateral
            document.getElementById('previewTitulo').innerText = item.Producto;
            document.getElementById('previewPrecio').innerText = item.Precio;

            const descText = (item.Descripción && item.Descripción !== '-') 
                ? item.Descripción 
                : 'Delicioso platillo preparado al momento con el sazón tradicional de la casa.';
            document.getElementById('previewDesc').innerText = descText;

            const previewImg = document.getElementById('previewImg');
            if (item.Imagen && item.Imagen.trim() !== '') {
                previewImg.src = item.Imagen.trim();
            } else {
                previewImg.src = 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80';
            }
        }
    </script>
</body>
</html>
    </script>
</body>
</html>
