<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Menú Digital 🔥</title>
    <!-- Librería para leer el CSV de Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { 
            background-color: #0d0d0d; 
            color: #ffffff; 
            padding-top: env(safe-area-inset-top); 
            padding-bottom: 60px; 
        }

        header { padding: 20px 20px 10px 20px; text-align: center; }
        h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* BANNER DE PROMOCIONES */
        .banner-container {
            max-width: 1150px;
            margin: 0 auto 20px auto;
            padding: 0 20px;
            display: block;
        }

        .carrusel {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background: #141414;
        }

        .carrusel-slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: flex-end;
        }

        .slide img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.65);
        }

        .slide-content {
            position: relative;
            z-index: 2;
            padding: 15px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            width: 100%;
        }

        .slide-tag {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            background: #d32f2f;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .slide-titulo {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
        }

        .carrusel-dots {
            position: absolute;
            bottom: 10px;
            right: 15px;
            display: flex;
            gap: 6px;
            z-index: 3;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.activo {
            background: #d32f2f;
            width: 20px;
            border-radius: 10px;
        }

        /* NAVEGACIÓN SUPERIOR */
        .nav-categorias { 
            display: flex; overflow-x: auto; padding: 12px 20px; gap: 12px; 
            position: sticky; top: 0; z-index: 100; 
            background: rgba(13, 13, 13, 0.95); backdrop-filter: blur(8px);
            scrollbar-width: none; border-bottom: 1px solid #222; margin-bottom: 25px;
        }
        .nav-categorias::-webkit-scrollbar { display: none; }
        .nav-categorias a { 
            color: #a3a3a3; text-decoration: none; padding: 8px 18px; 
            background: #1c1c1c; border: 1px solid #333; border-radius: 20px; 
            white-space: nowrap; font-size: 0.85rem; font-weight: 600; transition: all 0.3s ease;
        }
        .nav-categorias a:hover, .nav-categorias a.activo { 
            background: #d32f2f; color: white; border-color: #d32f2f; box-shadow: 0 0 10px rgba(211, 47, 47, 0.4); 
        }

        /* ESTRUCTURA PRINCIPAL */
        .main-layout { display: flex; gap: 30px; max-width: 1150px; margin: 0 auto; padding: 0 20px; align-items: flex-start; }
        .menu-seccion { flex: 1; min-width: 0; }

        .categoria { margin-bottom: 40px; padding-top: 70px; margin-top: -60px; }
        .categoria-titulo { 
            font-size: 1.4rem; color: #d32f2f; text-transform: uppercase; font-weight: 800;
            margin-bottom: 15px; display: inline-block; border-bottom: 2px solid #d32f2f; padding-bottom: 4px;
        }

        .item-card { 
            background: #151515; border: 1px solid #2a2a2a; border-radius: 12px; 
            margin-bottom: 12px; overflow: hidden; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
        }
        .item-card:hover { border-color: #555; }
        .item-card.seleccionado { 
            border-color: #d32f2f; background: #1e1515; 
            box-shadow: 0 0 15px rgba(211, 47, 47, 0.2); 
        }

        .item-header { display: flex; align-items: center; gap: 15px; padding: 15px; }
        .item-img-mini { 
            width: 55px; height: 55px; border-radius: 50%; object-fit: cover; 
            background-color: #2a2a2a; flex-shrink: 0; border: 2px solid #333;
            transition: all 0.3s ease;
        }
        
        .item-info { flex: 1; }
        .item-nombre { font-weight: 700; font-size: 1.05rem; margin: 0 0 4px 0; color: #f1f1f1; }
        .item-desc-corta { 
            font-size: 0.8rem; color: #888; margin: 0; 
            display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; 
            transition: opacity 0.3s ease;
        }
        
        .item-precio { 
            font-weight: 700; color: #d1d5db; font-size: 1rem; background: #1f2937; 
            border: 1px solid #374151; padding: 6px 12px; border-radius: 20px; white-space: nowrap; 
        }

        .item-detalles-desplegable {
            max-height: 0; opacity: 0; overflow: hidden; 
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, padding 0.3s ease;
            padding: 0 15px; border-top: 1px solid transparent;
        }

        @media (max-width: 820px) {
            .item-card.seleccionado .item-detalles-desplegable {
                max-height: 500px; opacity: 1; padding: 15px; border-top: 1px solid #333;
            }
            .item-card.seleccionado .item-desc-corta { opacity: 0; }
            .item-card.seleccionado .item-img-mini { transform: scale(0.8); opacity: 0.5; }
            .preview-panel { display: none; } 
            .main-layout { display: block; }
            .carrusel { height: 150px; }
        }

        .desc-full-img {
            width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 12px;
            background: #202020; border: 1px solid #333;
        }
        .desc-full-titulo { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #d32f2f; font-weight: 700; margin-bottom: 6px; }
        .desc-full-texto { font-size: 0.9rem; color: #a3a3a3; line-height: 1.5; margin: 0; }

        .preview-panel {
            width: 360px; position: sticky; top: 75px; background: #141414; border: 1px solid #282828;
            border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); flex-shrink: 0;
            display: flex; flex-direction: column; gap: 15px;
        }
        .preview-img-wrapper { width: 100%; height: 220px; border-radius: 12px; overflow: hidden; background: #202020; border: 1px solid #333; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .preview-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .preview-titulo { font-size: 1.25rem; font-weight: 800; color: #ffffff; margin: 0; line-height: 1.3; }
        .preview-precio { font-size: 1.15rem; font-weight: 800; color: #d1d5db; background: #1f2937; border: 1px solid #374151; padding: 4px 12px; border-radius: 15px; white-space: nowrap; }
        .preview-divider { height: 1px; background: #262626; margin: 2px 0; }
        .preview-desc-titulo { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #d32f2f; font-weight: 700; margin-bottom: 6px; }
        .preview-desc { font-size: 0.9rem; color: #a3a3a3; line-height: 1.5; margin: 0; font-weight: 400; }

        #pantallaCarga { text-align: center; padding: 60px 20px; color: #666; font-size: 1.1rem; }
    </style>
</head>
<body>

    <header>
        <h1>MENÚ DIGITAL 🔥</h1>
    </header>

    <div class="banner-container" id="bannerContainer">
        <div class="carrusel">
            <div class="carrusel-slides" id="carruselSlides"></div>
            <div class="carrusel-dots" id="carruselDots"></div>
        </div>
    </div>

    <nav class="nav-categorias" id="barraNav"></nav>

    <div class="main-layout">
        <div class="menu-seccion" id="menuContainer">
            <div id="pantallaCarga">Cargando cortes y guisados...</div>
        </div>

        <aside class="preview-panel" id="previewPanel">
            <div class="preview-img-wrapper">
                <img src="" id="previewImg" class="preview-img" alt="Platillo seleccionado" onerror="this.src='https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80';">
            </div>
            <div class="preview-header">
                <h3 class="preview-titulo" id="previewTitulo">Selecciona un platillo</h3>
                <span class="preview-precio" id="previewPrecio">$0.00</span>
            </div>
            <div class="preview-divider"></div>
            <div>
                <p class="preview-desc-titulo">Descripción</p>
                <p class="preview-desc" id="previewDesc">Toca cualquier producto del menú para ver sus detalles e imagen completa aquí.</p>
            </div>
        </aside>
    </div>

    <script>
        const sheetID = '1Yf2x7wxdH5qiP4b8KOpgBHB_WQ51O83VQT4y6D4dZPU';
        const urlMenuCSV = `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv&gviz/tq?tq=SELECT%20*`;
        const urlPromosCSV = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:csv&sheet=Promos`;
        
        let listaMenuData = [];
        let slideActual = 0;
        let carruselTimer = null;

        // Cargar Promos desde la pestaña 'Promos'
        Papa.parse(urlPromosCSV, {
            download: true,
            header: true,
            complete: function(resultados) {
                renderizarPromos(resultados.data);
            },
            error: function() {
                renderizarPromos([]);
            }
        });

        // Cargar Menú desde la pestaña principal
        Papa.parse(urlMenuCSV, {
            download: true,
            header: true,
            complete: function(resultados) {
                renderizarMenu(resultados.data);
            },
            error: function() {
                document.getElementById('pantallaCarga').innerText = "Hubo un error cargando el menú. Verifica la conexión.";
            }
        });

        function obtenerCampo(objeto, nombresPosibles) {
            if (!objeto) return '';
            for (let k in objeto) {
                let kLimpia = k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                for (let pos of nombresPosibles) {
                    if (kLimpia.includes(pos)) return objeto[k];
                }
            }
            return '';
        }

        function renderizarPromos(promos) {
            const container = document.getElementById('bannerContainer');
            const slidesContainer = document.getElementById('carruselSlides');
            const dotsContainer = document.getElementById('carruselDots');
            
            let promosActivas = [];

            if (Array.isArray(promos) && promos.length > 0) {
                promosActivas = promos.map(p => {
                    const titulo = obtenerCampo(p, ['titulo', 'title', 'nombre', 'promo']) || Object.values(p)[0] || '';
                    const etiqueta = obtenerCampo(p, ['etiqueta', 'tag', 'badge']) || Object.values(p)[1] || 'Especial 🔥';
                    const imagen = obtenerCampo(p, ['imagen', 'img', 'foto']) || Object.values(p)[2] || '';
                    const estado = obtenerCampo(p, ['estado', 'status']) || 'Activo';
                    return { 
                        titulo: String(titulo).trim(), 
                        etiqueta: String(etiqueta).trim(), 
                        imagen: String(imagen).trim(), 
                        estado: String(estado).trim() 
                    };
                }).filter(p => p.titulo !== '' && (p.estado.toLowerCase().includes('activ') || p.estado === ''));
            }

            // Fallback: si no hay datos de red todavía, mostrar promociones iniciales
            if (promosActivas.length === 0) {
                promosActivas = [
                    { titulo: "1 kg de Barbacoa + Consomé Gratis", etiqueta: "Especial del Día 🔥", imagen: "img/promo1.jpg" },
                    { titulo: "Chilaquiles + Café de Olla por $149", etiqueta: "Paquete Mañanero ☕", imagen: "img/promo2.jpg" }
                ];
            }

            slidesContainer.innerHTML = '';
            dotsContainer.innerHTML = '';

            promosActivas.forEach((p, i) => {
                const img = (p.imagen && p.imagen !== '') ? p.imagen : 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1000&q=80';
                const tag = p.etiqueta || 'Promoción';

                slidesContainer.innerHTML += `
                    <div class="slide">
                        <img src="${img}" alt="${p.titulo}" onerror="this.src='https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1000&q=80';">
                        <div class="slide-content">
                            <span class="slide-tag">${tag}</span>
                            <h3 class="slide-titulo">${p.titulo}</h3>
                        </div>
                    </div>
                `;

                dotsContainer.innerHTML += `<div class="dot ${i === 0 ? 'activo' : ''}" onclick="moverSlide(${i})"></div>`;
            });

            container.style.display = 'block';
            if (promosActivas.length > 1) {
                iniciarCarruselAuto(promosActivas.length);
            }
        }

        function renderizarMenu(datos) {
            const nav = document.getElementById('barraNav');
            const container = document.getElementById('menuContainer');
            nav.innerHTML = '';
            container.innerHTML = '';
            
            listaMenuData = datos.filter(fila => fila.Categoría && fila.Producto);

            const categorias = {};
            listaMenuData.forEach((item, index) => {
                item._posicion = index;
                if(!categorias[item.Categoría]) categorias[item.Categoría] = [];
                categorias[item.Categoría].push(item);
            });

            let esPrimero = true;
            let HTMLCompleto = '';

            Object.keys(categorias).forEach(cat => {
                const idCat = cat.replace(/\s+/g, '-').toLowerCase();
                const claseActivo = esPrimero ? 'class="activo"' : '';
                nav.innerHTML += `<a href="#${idCat}" ${claseActivo}>${cat}</a>`;

                HTMLCompleto += `<div id="${idCat}" class="categoria"><h2 class="categoria-titulo">${cat}</h2>`;

                categorias[cat].forEach(item => {
                    const descCorta = (item.Descripción && item.Descripción !== '-') ? item.Descripción : 'Delicioso platillo preparado al momento.';
                    const rutaImg = (item.Imagen && item.Imagen.trim() !== '') ? item.Imagen.trim() : 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80';
                    const miniImg = (item.Imagen && item.Imagen.trim() !== '') ? `<img src="${item.Imagen.trim()}" class="item-img-mini" alt="${item.Producto}" onerror="this.style.display='none'">` : ``;

                    HTMLCompleto += `
                        <div class="item-card" id="item-card-${item._posicion}" onclick="seleccionarPorIndice(${item._posicion})">
                            <div class="item-header">
                                ${miniImg}
                                <div class="item-info">
                                    <p class="item-nombre">${item.Producto}</p>
                                    <p class="item-desc-corta">${descCorta}</p>
                                </div>
                                <div class="item-precio">${item.Precio}</div>
                            </div>
                            <div class="item-detalles-desplegable">
                                <img src="${rutaImg}" class="desc-full-img" alt="${item.Producto}" onerror="this.style.display='none'">
                                <p class="desc-full-titulo">Descripción Completa</p>
                                <p class="desc-full-texto">${descCorta}</p>
                            </div>
                        </div>
                    `;
                });

                HTMLCompleto += `</div>`;
                esPrimero = false;
            });

            container.innerHTML = HTMLCompleto;

            if (listaMenuData.length > 0 && window.innerWidth > 820) {
                seleccionarPorIndice(0);
            }

            const enlacesNav = nav.querySelectorAll('a');
            enlacesNav.forEach(enlace => {
                enlace.addEventListener('click', function() {
                    enlacesNav.forEach(e => e.classList.remove('activo'));
                    this.classList.add('activo');
                });
            });
        }

        function seleccionarPorIndice(index) {
            const item = listaMenuData[index];
            if (!item) return;

            const tarjetaSeleccionada = document.getElementById(`item-card-${index}`);
            
            if (window.innerWidth <= 820 && tarjetaSeleccionada.classList.contains('seleccionado')) {
                tarjetaSeleccionada.classList.remove('seleccionado');
                return;
            }

            document.querySelectorAll('.item-card').forEach(card => card.classList.remove('seleccionado'));
            tarjetaSeleccionada.classList.add('seleccionado');

            if (window.innerWidth > 820) {
                const descText = (item.Descripción && item.Descripción !== '-') ? item.Descripción : 'Delicioso platillo preparado al momento.';
                const imgSrc = (item.Imagen && item.Imagen.trim() !== '') ? item.Imagen.trim() : 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80';

                document.getElementById('previewTitulo').innerText = item.Producto;
                document.getElementById('previewPrecio').innerText = item.Precio;
                document.getElementById('previewDesc').innerText = descText;
                document.getElementById('previewImg').src = imgSrc;
            } else {
                setTimeout(() => {
                    const rect = tarjetaSeleccionada.getBoundingClientRect();
                    if (rect.bottom > window.innerHeight) {
                        tarjetaSeleccionada.scrollIntoView({ behavior: 'smooth', block: 'end' });
                    }
                }, 300);
            }
        }

        function iniciarCarruselAuto(totalSlides) {
            if (carruselTimer) clearInterval(carruselTimer);
            carruselTimer = setInterval(() => {
                slideActual = (slideActual + 1) % totalSlides;
                moverSlide(slideActual);
            }, 4000);
        }

        function moverSlide(index) {
            slideActual = index;
            const container = document.getElementById('carruselSlides');
            const dots = document.querySelectorAll('.dot');
            if (container) {
                container.style.transform = `translateX(-${index * 100}%)`;
            }
            dots.forEach((dot, i) => {
                dot.classList.toggle('activo', i === index);
            });
        }
    </script>
</body>
</html>
