<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital</title>
    <!-- Librería gratuita para leer el CSV mágicamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #111827; color: #f9fafb; margin: 0; padding: 0; }
        header { background-color: #991b1b; padding: 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); }
        h1 { margin: 0; font-size: 1.5rem; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; }
        
        .nav-categorias { display: flex; overflow-x: auto; padding: 12px; background: #1f2937; gap: 10px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #374151; scrollbar-width: none; }
        .nav-categorias::-webkit-scrollbar { display: none; }
        .nav-categorias a { color: #f9fafb; text-decoration: none; padding: 8px 16px; background: #374151; border-radius: 20px; white-space: nowrap; font-size: 0.9rem; font-weight: 500; }
        .nav-categorias a:hover, .nav-categorias a:active { background: #ef4444; }
        
        .container { padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 60px; }
        .categoria { margin-bottom: 40px; padding-top: 70px; margin-top: -70px; }
        .categoria-titulo { font-size: 1.8rem; color: #ef4444; border-bottom: 2px solid #ef4444; padding-bottom: 5px; margin-bottom: 15px; text-transform: uppercase; }
        
        .item { display: flex; gap: 15px; align-items: center; padding: 15px 0; border-bottom: 1px solid #374151; }
        .item-img { width: 85px; height: 85px; border-radius: 10px; object-fit: cover; background-color: #374151; flex-shrink: 0; }
        .item-info { flex: 1; }
        .item-nombre { font-weight: bold; font-size: 1.1rem; margin: 0 0 4px 0; }
        .item-desc { font-size: 0.85rem; color: #9ca3af; margin: 0; line-height: 1.4; }
        .item-precio { font-weight: bold; color: #10b981; font-size: 1.15rem; background: #1f2937; padding: 6px 12px; border-radius: 6px; white-space: nowrap; }
        
        #pantallaCarga { text-align: center; padding: 50px; color: #9ca3af; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <h1>Menú Digital</h1>
    </header>

    <nav class="nav-categorias" id="barraNav"></nav>

    <div class="container" id="menuContainer">
        <div id="pantallaCarga">Cargando menú desde la nube... 🥩</div>
    </div>

    <script>
        // =========================================================
        // Pega aquí el link largo que te dio Google Sheets (el .csv)
        // =========================================================
        const urlCSV = 'https://docs.google.com/spreadsheets/d/1Yf2x7wxdH5qiP4b8KOpgBHB_WQ51O83VQT4y6D4dZPU/edit?usp=sharing'; 
        
        Papa.parse(urlCSV, {
            download: true,
            header: true,
            complete: function(resultados) {
                renderizarMenu(resultados.data);
            },
            error: function() {
                document.getElementById('pantallaCarga').innerText = "Hubo un error cargando el menú. Verifica el link del CSV.";
            }
        });

        function renderizarMenu(datos) {
            const nav = document.getElementById('barraNav');
            const container = document.getElementById('menuContainer');
            nav.innerHTML = '';
            container.innerHTML = '';
            
            // Agrupar los platillos por categoría automáticamente
            const categorias = {};
            datos.forEach(fila => {
                if(!fila.Categoría || !fila.Producto) return; // Salta filas vacías
                if(!categorias[fila.Categoría]) categorias[fila.Categoría] = [];
                categorias[fila.Categoría].push(fila);
            });

            // Dibujar el menú
            Object.keys(categorias).forEach(cat => {
                const idCat = cat.replace(/\s+/g, '-').toLowerCase();
                
                // Crea el botón en el menú de navegación superior
                nav.innerHTML += `<a href="#${idCat}">${cat}</a>`;

                // Crea el contenedor de la categoría
                let htmlCategoria = `<div id="${idCat}" class="categoria">
                                        <h2 class="categoria-titulo">${cat}</h2>`;

                // Agrega cada platillo de esta categoría
                categorias[cat].forEach(item => {
                    const desc = (item.Descripción && item.Descripción !== '-') ? `<p class="item-desc">${item.Descripción}</p>` : '';
                    const img = (item.Imagen && item.Imagen.trim() !== '') ? `<img src="${item.Imagen}" class="item-img" alt="${item.Producto}">` : '';
                    
                    htmlCategoria += `
                        <div class="item">
                            ${img}
                            <div class="item-info">
                                <p class="item-nombre">${item.Producto}</p>
                                ${desc}
                            </div>
                            <div class="item-precio">${item.Precio}</div>
                        </div>
                    `;
                });

                htmlCategoria += `</div>`;
                container.innerHTML += htmlCategoria;
            });
        }
    </script>
</body>
</html>
